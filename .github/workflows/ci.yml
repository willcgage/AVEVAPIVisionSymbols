name: CI

# Every push and pull request runs the same gate a release runs, minus the
# signing. The point is that `main` is always releasable: if this is green,
# tagging it produces a shippable MSI.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-verify:
    name: Build · 594 render checks · PI Web API suite
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # `npm ci` not `npm install` — installs exactly what package-lock.json
      # pins, and fails if the lockfile and package.json disagree.
      - name: Install dev dependencies
        run: npm ci

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      # Raw control characters make a file register as binary: grep skips it,
      # git stops diffing it, and a text-mode transfer to a Windows server can
      # mangle it. Cheap to check, invisible to review.
      - name: Check for raw control characters
        run: node tools/check-text.js

      # The build validator enforces the authoring contract: ES5 only,
      # namespaced CSS, correct registration, matching typeName.
      - name: Build
        run: node tools/build.js --clean

      # Renders every symbol in real Chromium: 3 sizes × 3 data scenarios ×
      # light and dark. Fails on exceptions, console errors, NaN in SVG
      # geometry, blank renders, unreadable text and clipped content.
      - name: Verify renders
        run: node tools/verify.js

      # Exercises the PI Web API layer against a mock deliberately
      # misconfigured six ways, and asserts writes are never cached, retried
      # or coalesced.
      - name: Verify PI Web API layer
        run: node tools/test-api.js

      # Removing a data source renumbers positional config (TraceSpec, Sankey
      # links, hotspots). Wrong renumbering draws the wrong attribute with no
      # error, so every rule and the built format pane are exercised here.
      - name: Verify data source removal and band editor
        run: node tools/test-sources.js

      # SYMBOL-REFERENCE.md is generated from the sources. If someone changed
      # a default and did not regenerate it, the committed docs are now lying.
      - name: Check generated docs are current
        run: |
          node tools/docgen.js
          if ! git diff --quiet -- docs/SYMBOL-REFERENCE.md; then
            echo "::error file=docs/SYMBOL-REFERENCE.md::Out of date. Run: node tools/docgen.js"
            git diff --stat -- docs/SYMBOL-REFERENCE.md
            exit 1
          fi

      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: render-failures
          path: dist/screenshots/
          if-no-files-found: ignore
          retention-days: 7

  installer-source:
    name: Installer structure
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # Compiles the generated WiX source with `wixl` and inspects the resulting
    # MSI's own tables. This is not the MSI that ships — the release workflow
    # builds that with the official WiX toolset on Windows — but it catches the
    # failures that matter on every pull request instead of at tag time:
    # a file missing from the package, a subfolder flattened, or a component
    # GUID drifting (which would make the *next* upgrade delete the file it
    # had just installed).
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Two packages, not one. Ubuntu 24.04 ships the wixl compiler separately
      # from msitools, which now provides only msiinfo/msibuild — the tools
      # verify-msi.js reads the built MSI's tables with. Installing msitools
      # alone leaves wixl missing, and the compile step then fails with
      # "wixl: command not found", which reads like a typo in the workflow
      # rather than a package that has to be asked for by name.
      - name: Install msitools and wixl
        run: sudo apt-get update && sudo apt-get install -y msitools wixl

      # No `npm ci` on purpose: this proves the build tooling stays
      # zero-dependency, which is what makes an air-gapped build machine viable.
      - name: Build without installing anything
        run: |
          node tools/build.js --clean
          node tools/wix.js

      - name: Compile installer source
        working-directory: dist/installer
        # PvxFull=0: wixl cannot compile the searches, conditions, file moves
        # and dialogs, so this is the structure without the behaviour. The
        # installer-windows job compiles and exercises the whole thing.
        run: wixl -a x64 -D PayloadDir=../ext -D PvxFull=0 -o PvxSymbols.msi PvxSymbols.wxs

      - name: Verify installer structure
        run: node tools/verify-msi.js

      - name: Upload WiX source
        uses: actions/upload-artifact@v4
        with:
          name: installer-source
          path: |
            dist/installer/PvxSymbols.wxs
            dist/installer/components.json
          retention-days: 14

  installer-windows:
    name: Install · upgrade from 1.6.0 and 1.7.0 · uninstall (Windows)
    runs-on: windows-latest
    timeout-minutes: 25

    # The table checks above prove the package is assembled right; they cannot
    # prove what Windows Installer does with it. Moving a 1.6.0 site's
    # pvx-config.js, removing the old flat files and resolving the drive and
    # PIPC folder are all runtime behaviour, so this job builds the real MSI
    # with the official toolset and installs it for real, against fake PI
    # Vision trees, including upgrades over the published 1.6.0 MSI and zip and
    # the 1.7.0 MSI.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build payload and installer source
        run: |
          node tools/build.js --clean
          node tools/wix.js

      - name: Install WiX Toolset v3
        shell: pwsh
        run: |
          nuget install WiX -Version 3.14.1 -OutputDirectory ${{ runner.temp }}\wix
          $candle = Get-ChildItem -Path ${{ runner.temp }}\wix -Recurse -Filter candle.exe |
                    Select-Object -First 1
          "WIX_BIN=$($candle.DirectoryName)" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Compile MSI
        working-directory: dist/installer
        shell: pwsh
        run: |
          & "$env:WIX_BIN\candle.exe" -nologo -dPayloadDir="..\ext" -dPvxFull=1 -arch x64 -ext WixUIExtension `
              -out PvxSymbols.wixobj PvxSymbols.wxs
          if ($LASTEXITCODE -ne 0) { throw "candle failed ($LASTEXITCODE)" }
          & "$env:WIX_BIN\light.exe" -nologo -sval -ext WixUIExtension `
              -out PvxSymbols-ci.msi PvxSymbols.wixobj
          if ($LASTEXITCODE -ne 0) { throw "light failed ($LASTEXITCODE)" }

      # The releases this one upgrades from. Fetched rather than committed:
      # they are the published artifacts sites actually have installed.
      - name: Download the 1.6.0 MSI and zip, and the 1.7.0 MSI
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v1.6.0 --repo ${{ github.repository }} --dir legacy `
              --pattern 'PvxSymbols-1.6.0.msi' --pattern 'pvx-symbols-1.6.0.zip'
          gh release download v1.7.0 --repo ${{ github.repository }} --dir legacy `
              --pattern 'PvxSymbols-1.7.0.msi'
          Get-ChildItem legacy

      - name: Install, upgrade and uninstall for real
        shell: pwsh
        run: |
          ./tools/test-installer.ps1 -Msi dist/installer/PvxSymbols-ci.msi `
              -LegacyMsi legacy/PvxSymbols-1.6.0.msi -LegacyZip legacy/pvx-symbols-1.6.0.zip `
              -PreviousMsi legacy/PvxSymbols-1.7.0.msi `
              -WorkDir "${{ runner.temp }}\pvx-installer-test"

      - name: Upload msiexec logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installer-logs
          path: ${{ runner.temp }}/pvx-installer-test/*.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload the official-toolset MSI
        uses: actions/upload-artifact@v4
        with:
          name: installer-official
          path: |
            dist/installer/PvxSymbols-ci.msi
            dist/installer/components.json
          retention-days: 7

  installer-tables-strict:
    name: Installer tables (official toolset build)
    needs: installer-windows
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # msiinfo exists only on Linux and the official toolset only on Windows,
    # so the strict table checks (Permanent + NeverOverwrite, the searches,
    # the move, the clean-up, the dialog) read the Windows job's MSI here.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install msitools
        run: sudo apt-get update && sudo apt-get install -y msitools
      - uses: actions/download-artifact@v4
        with:
          name: installer-official
          path: dist/installer
      - name: Verify installer tables strictly
        run: node tools/verify-msi.js dist/installer/PvxSymbols-ci.msi --strict-attributes
