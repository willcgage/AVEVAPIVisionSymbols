name: Release

# Triggered by a version tag: git tag v1.5.0 && git push origin v1.5.0
#
# Produces, and attaches to a GitHub Release:
#   PvxSymbols-<version>.msi        the installer  (built with official WiX)
#   pvx-symbols-<version>.zip       the manual-copy package + PowerShell script
#   PvxSymbols.wxs                  the installer source that produced the MSI
#   components.json                 the component GUID map, for auditing
#   SHA256SUMS.txt                  checksums for everything above
#
# The zip stays in the artifact set deliberately. An MSI needs an elevated
# session on the box; sites that deploy by dropping files on a share, or that
# have to get an installer through change control first, still need the folder.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (must match package.json)'
        required: true

permissions:
  contents: write

jobs:
  # --------------------------------------------------------------------------
  # The gate. A tag does not get a release unless the same checks CI runs on
  # every pull request pass on the tagged commit.
  # --------------------------------------------------------------------------
  gate:
    name: Verify the tagged commit
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - name: Tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag v$TAG does not match package.json version $PKG"
            exit 1
          fi
          echo "Tag and package.json agree on $PKG"

      - run: node tools/build.js --clean
      - run: node tools/verify.js
      - run: node tools/test-api.js

  # --------------------------------------------------------------------------
  # Build the shipping MSI with the official WiX toolset, then assert against
  # the MSI's own tables — including the Permanent + NeverOverwrite bits that
  # protect a site's pvx-config.js, which the Linux CI job cannot check because
  # wixl ignores those attributes.
  # --------------------------------------------------------------------------
  installer:
    name: Build MSI
    needs: gate
    runs-on: windows-latest
    timeout-minutes: 20
    # The signing secrets are lifted to the job so the signing step can test
    # whether they are set. `secrets` is not an available context in a step's
    # `if:` — naming it there does not evaluate to empty, it makes the whole
    # workflow file invalid, and every run then fails at startup in 0s with no
    # jobs and the file path in place of the workflow name. Job-level `env`
    # *is* in scope for a step `if:`, which a step's own `env:` is not.
    env:
      CERT_PFX_BASE64: ${{ secrets.CODE_SIGN_PFX_BASE64 }}
      CERT_PASSWORD: ${{ secrets.CODE_SIGN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build payload and installer source
        run: |
          node tools/build.js --clean --package
          node tools/wix.js

      - name: Install WiX Toolset v3
        run: |
          nuget install WiX -Version 3.14.1 -OutputDirectory ${{ runner.temp }}\wix
          $candle = Get-ChildItem -Path ${{ runner.temp }}\wix -Recurse -Filter candle.exe |
                    Select-Object -First 1
          "WIX_BIN=$($candle.DirectoryName)" | Out-File -FilePath $env:GITHUB_ENV -Append
        shell: pwsh

      - name: Compile MSI
        working-directory: dist/installer
        shell: pwsh
        run: |
          & "$env:WIX_BIN\candle.exe" -nologo -dPayloadDir="..\ext" -dPvxFull=1 -arch x64 -ext WixUIExtension `
              -out PvxSymbols.wixobj PvxSymbols.wxs
          if ($LASTEXITCODE -ne 0) { throw "candle failed ($LASTEXITCODE)" }
          & "$env:WIX_BIN\light.exe" -nologo -sval -ext WixUIExtension `
              -out "PvxSymbols-$(node -p "require('../../package.json').version").msi" `
              PvxSymbols.wixobj
          Get-ChildItem *.msi

      # Reads the shipping MSI's tables and fails the release if the site
      # settings component has lost its protection. Without these bits an
      # upgrade silently overwrites a site's PI Web API configuration.
      #
      # The component is found by GUID, not by file name. Windows Installer
      # SQL has no LIKE operator — OpenView rejects the whole statement with
      # "OpenView,Sql" rather than returning nothing, so a name pattern cannot
      # be used. Nor would an equality test on the name work: the File table
      # stores "SHORTNAME|Long Name", not the plain name. components.json is
      # written by the same tools/wix.js run that emitted the .wxs, so its
      # GUID is exactly the component whose attributes are meant to be checked.
      - name: Assert site settings are protected
        shell: pwsh
        run: |
          $manifest = Get-Content dist/installer/components.json | ConvertFrom-Json
          $entry = $manifest.components | Where-Object { $_.path -eq $manifest.siteConfig }
          if (-not $entry) {
            throw "$($manifest.siteConfig) is missing from components.json. Check SITE_CONFIG in tools/wix.js"
          }
          if (-not $entry.permanent) {
            throw "$($manifest.siteConfig) is not marked permanent in components.json. tools/wix.js never applied the protection"
          }

          $msi = (Get-ChildItem dist/installer/*.msi | Select-Object -First 1).FullName
          $installer = New-Object -ComObject WindowsInstaller.Installer
          $db = $installer.GetType().InvokeMember('OpenDatabase','InvokeMethod',$null,
                  $installer,@($msi,0))
          $q = 'SELECT `Attributes` FROM `Component` WHERE `ComponentId` = ''{0}''' -f
               "{$($entry.guid.ToUpper())}"
          $view = $db.GetType().InvokeMember('OpenView','InvokeMethod',$null,$db,@($q))
          $view.GetType().InvokeMember('Execute','InvokeMethod',$null,$view,$null)
          $rec = $view.GetType().InvokeMember('Fetch','InvokeMethod',$null,$view,$null)
          if ($null -eq $rec) {
            throw "Component $($entry.guid) ($($manifest.siteConfig)) is not in the MSI"
          }
          $attrs = $rec.GetType().InvokeMember('IntegerData','GetProperty',$null,$rec,@(1))
          $PERMANENT = 16; $NEVER_OVERWRITE = 128
          Write-Host "$($manifest.siteConfig) component attributes = $attrs"
          if (-not ($attrs -band $PERMANENT))       { throw "$($manifest.siteConfig) is not Permanent" }
          if (-not ($attrs -band $NEVER_OVERWRITE)) { throw "$($manifest.siteConfig) is not NeverOverwrite" }
          Write-Host "Site settings are Permanent + NeverOverwrite."

      # --- Optional code signing -------------------------------------------
      # Unsigned, Windows shows "Unknown Publisher" on the MSI and execution
      # policy may block Deploy-PvxSymbols.ps1. Add the two secrets to enable;
      # without them the release still builds, just unsigned.
      # Tests the job-level env var, not `secrets` — see the note on the job.
      - name: Sign MSI and PowerShell script
        if: env.CERT_PFX_BASE64 != ''
        shell: pwsh
        run: |
          $pfx = "${{ runner.temp }}\cert.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:CERT_PFX_BASE64))
          $signtool = (Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" `
                        -Recurse -Filter signtool.exe |
                       Where-Object { $_.FullName -match 'x64' } | Select-Object -First 1).FullName
          & $signtool sign /f $pfx /p $env:CERT_PASSWORD /fd SHA256 `
              /tr http://timestamp.digicert.com /td SHA256 `
              (Get-ChildItem dist/installer/*.msi).FullName dist/Deploy-PvxSymbols.ps1
          Remove-Item $pfx -Force

      # Every artifact is resolved before it is copied, and a pattern that
      # matches nothing fails the release. Copy-Item with a wildcard is silent
      # when nothing matches -- not an error even under ErrorActionPreference
      # Stop -- which is how v1.5.0 published without its zip: the file was
      # never built, the copy said nothing, and SHA256SUMS.txt listed the three
      # files that did arrive and looked entirely consistent.
      - name: Package artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          $wanted = @(
            @{ Pattern = 'dist/installer/*.msi';           What = 'the installer' },
            @{ Pattern = 'dist/pvx-symbols-*.zip';         What = 'the manual-copy package (build.js --package)' },
            @{ Pattern = 'dist/installer/PvxSymbols.wxs';  What = 'the installer source' },
            @{ Pattern = 'dist/installer/components.json'; What = 'the component GUID map' }
          )
          foreach ($w in $wanted) {
            $hit = Get-ChildItem $w.Pattern -ErrorAction SilentlyContinue
            if (-not $hit) { throw "$($w.Pattern) matched nothing - $($w.What) is missing from dist/" }
            $hit | ForEach-Object { Copy-Item $_.FullName artifacts/ }
          }
          Get-FileHash artifacts/* -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" } |
            Set-Content artifacts/SHA256SUMS.txt -Encoding ascii
          Get-Content artifacts/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: artifacts/

  publish:
    name: Publish release
    needs: installer
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-artifacts
          path: artifacts

      # The tag is v1.6.0 but the MSI is PvxSymbols-1.6.0.msi, so the install
      # commands in the notes cannot use github.ref_name directly: v1.5.0's
      # notes told people to run an msiexec on a file that did not exist.
      - name: Version without the tag's v
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          body: |
            ## Installing

            **MSI** — elevated PowerShell on each PI Vision web server:

            ```powershell
            msiexec /i PvxSymbols-${{ steps.ver.outputs.version }}.msi /qn /l*v pvx-install.log
            # PI on another drive, or PIPC in a non-standard folder:
            msiexec /i PvxSymbols-${{ steps.ver.outputs.version }}.msi INSTALLDRIVE=D: /qn
            msiexec /i PvxSymbols-${{ steps.ver.outputs.version }}.msi INSTALLDRIVE=E: PIPCFOLDER="Apps\PIPC" /qn
            ```

            Then recycle the PI Vision app pool and hard-refresh the browser (Ctrl+F5).

            **Manual copy** — use `pvx-symbols-*.zip` and the included
            `Deploy-PvxSymbols.ps1` if an MSI has to clear change control first.

            Without arguments the MSI uses `PIHOME64`, then
            `C:\Program Files\PIPC\PIVision`; run it interactively to pick the
            folder in a dialog.

            PVX puts its symbol files directly in `ext\`, its icons in
            `ext\icons\` and its runtime in `ext\libraries\pvx\`, the layout
            AVEVA's guide describes. Upgrading removes what earlier versions
            left elsewhere, and from 1.6.0 or earlier moves your
            `ext\libraries\pvx-config.js` into `ext\libraries\pvx\`. The
            settings file is never overwritten by an upgrade and never removed
            by an uninstall. See `docs/DEPLOYMENT.md`.

            Verify downloads against `SHA256SUMS.txt`.
