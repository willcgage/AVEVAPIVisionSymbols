<div class="pvx pvx-embed"
     ng-style="{'border-radius': (config.CornerRadius || 0) + 'px'}">
    <div class="pvx-surface pvx-embed-surface"
         ng-style="{'background': pvx.surface, 'border-radius': 'inherit'}">

        <div class="pvx-embed-bar" ng-if="config.ShowToolbar">
            <span class="pvx-embed-title pvx-truncate" title="{{pvx.target || pvx.title}}">{{pvx.title}}</span>
            <button type="button" class="pvx-embed-tool" ng-if="pvx.target" ng-click="pvx.reload()" title="Reload the page" aria-label="Reload the page">&#x21BB;</button>
            <a class="pvx-embed-tool" ng-if="pvx.target" ng-href="{{pvx.target}}" target="_blank" rel="noopener noreferrer" title="Open in a new tab">Open &#x2197;</a>
        </div>

        <!-- The frame is created by symbol.js, so a digest never reloads it. -->
        <div class="pvx-body pvx-embed-body">
            <div class="pvx-embed-frame"></div>
            <div class="pvx-embed-shield" ng-if="pvx.edit" title="Editing: the page is not live here"></div>
        </div>

        <div class="pvx-embed-note" ng-if="pvx.note" ng-class="{'pvx-embed-warn': pvx.warn}" title="{{pvx.note}}">{{pvx.note}}</div>
    </div>
</div>
