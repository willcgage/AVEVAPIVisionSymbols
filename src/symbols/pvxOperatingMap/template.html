<div class="pvx pvx-opmap"
     ng-style="{'background': config.Transparent ? 'transparent' : (config.BackgroundColor || ''),
                'border-radius': (config.CornerRadius || 0) + 'px'}">
    <div class="pvx-surface">

        <div class="pvx-header pvx-opmap-header" ng-if="(config.ShowLabel && pvx.title) || pvx.badge">
            <div class="pvx-title pvx-truncate" ng-if="config.ShowLabel && pvx.title" title="{{pvx.title}}">{{pvx.title}}</div>
            <span class="pvx-opmap-badge pvx-num pvx-truncate" ng-if="pvx.badge"
                  ng-style="{'color': pvx.badgeColor, 'background': pvx.badgeBg}"
                  title="{{pvx.badge}}">{{pvx.badge}}</span>
        </div>

        <div class="pvx-body">
            <div class="pvx-opmap-body"></div>
        </div>

        <div class="pvx-footer" ng-if="pvx.note">
            <span class="pvx-truncate pvx-opmap-note" title="{{pvx.note}}">{{pvx.note}}</span>
        </div>

    </div>

    <div class="pvx-error-badge" ng-if="pvx.error" title="{{pvx.error}}"></div>
</div>
