<div class="pvx pvx-profile"
     ng-style="{'background': pvx.background,
                'border-radius': (config.CornerRadius || 0) + 'px'}">
    <div class="pvx-surface pvx-profile-surface">

        <div class="pvx-header" ng-if="pvx.showHeader && (pvx.title || pvx.subtitle)">
            <div class="pvx-title pvx-truncate" title="{{pvx.title}}">{{pvx.title}}</div>
            <div class="pvx-subtitle pvx-truncate" ng-if="pvx.subtitle">{{pvx.subtitle}}</div>
        </div>

        <div class="pvx-body">
            <!-- The profile line, points, limit envelope, shadow, axes and every
                 label are drawn as SVG by symbol.js; keep this div empty. -->
            <div class="pvx-profile-body"></div>
        </div>

        <div class="pvx-footer" ng-if="pvx.showFooter">
            <span class="pvx-profile-stats pvx-num pvx-truncate"
                  ng-if="pvx.stats" title="{{pvx.stats}}">{{pvx.stats}}</span>
            <span class="pvx-profile-note pvx-truncate"
                  ng-if="pvx.note" title="{{pvx.note}}">{{pvx.note}}</span>
        </div>

    </div>

    <div class="pvx-error-badge" ng-if="pvx.error" title="{{pvx.error}}"></div>
</div>
