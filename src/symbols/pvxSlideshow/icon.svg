<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Display slideshow">
    <!-- The screen. Inset by half the stroke so the outline stays inside the box. -->
    <rect x="66" y="108" width="380" height="236" rx="26" fill="none" stroke="#d6dbe1" stroke-width="20"/>
    <!-- Play triangle: this screen advances by itself. -->
    <path d="M222 176 L318 226 L222 276 Z" fill="#3b82c4"/>
    <!-- Position dots below the screen — the slideshow is on the middle one. -->
    <circle cx="196" cy="418" r="16" fill="#d6dbe1"/>
    <circle cx="256" cy="418" r="20" fill="#3b82c4"/>
    <circle cx="316" cy="418" r="16" fill="#d6dbe1"/>
</svg>
