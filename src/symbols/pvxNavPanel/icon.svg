<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Navigation panel">
    <!-- Left button, outlined. Inset by half the stroke width so the stroke
         stays inside the 140x160 button box that starts at x=20. -->
    <rect x="28" y="184" width="124" height="144" rx="22" fill="none" stroke="#d6dbe1" stroke-width="16"/>
    <!-- Middle button, filled and selected -->
    <rect x="186" y="176" width="140" height="160" rx="30" fill="#3b82c4"/>
    <!-- Right button, outlined -->
    <rect x="360" y="184" width="124" height="144" rx="22" fill="none" stroke="#d6dbe1" stroke-width="16"/>
    <!-- Chevron inside the selected button: this bar navigates -->
    <path d="M244 230 L270 256 L244 282" fill="none" stroke="#ffffff" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
