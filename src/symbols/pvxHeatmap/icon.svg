<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="PVX Heatmap">
    <title>PVX Heatmap</title>
    <!-- 5 x 4 grid of rounded cells, shaded across the PVX sequential ramp
         (#e8f0f7 -> #0d3b66) with a hot core, so the icon reads as a heatmap
         at 16px as well as full size. Transparent background by design. -->
    <g>
        <rect x="34"  y="80"  width="76" height="76" rx="12" fill="#e8f0f7"/>
        <rect x="126" y="80"  width="76" height="76" rx="12" fill="#b3cfe8"/>
        <rect x="218" y="80"  width="76" height="76" rx="12" fill="#75aad8"/>
        <rect x="310" y="80"  width="76" height="76" rx="12" fill="#b3cfe8"/>
        <rect x="402" y="80"  width="76" height="76" rx="12" fill="#e8f0f7"/>

        <rect x="34"  y="172" width="76" height="76" rx="12" fill="#b3cfe8"/>
        <rect x="126" y="172" width="76" height="76" rx="12" fill="#3b82c4"/>
        <rect x="218" y="172" width="76" height="76" rx="12" fill="#1c5c92"/>
        <rect x="310" y="172" width="76" height="76" rx="12" fill="#3b82c4"/>
        <rect x="402" y="172" width="76" height="76" rx="12" fill="#b3cfe8"/>

        <rect x="34"  y="264" width="76" height="76" rx="12" fill="#75aad8"/>
        <rect x="126" y="264" width="76" height="76" rx="12" fill="#1c5c92"/>
        <rect x="218" y="264" width="76" height="76" rx="12" fill="#0d3b66"/>
        <rect x="310" y="264" width="76" height="76" rx="12" fill="#1c5c92"/>
        <rect x="402" y="264" width="76" height="76" rx="12" fill="#75aad8"/>

        <rect x="34"  y="356" width="76" height="76" rx="12" fill="#e8f0f7"/>
        <rect x="126" y="356" width="76" height="76" rx="12" fill="#75aad8"/>
        <rect x="218" y="356" width="76" height="76" rx="12" fill="#3b82c4"/>
        <rect x="310" y="356" width="76" height="76" rx="12" fill="#75aad8"/>
        <rect x="402" y="356" width="76" height="76" rx="12" fill="#b3cfe8"/>
    </g>
</svg>
