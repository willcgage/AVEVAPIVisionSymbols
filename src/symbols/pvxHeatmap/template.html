<div class="pvx pvx-heat"
     ng-style="{'background': pvx.background,
                'border-radius': (config.CornerRadius || 0) + 'px'}">
    <div class="pvx-surface pvx-heat-surface">

        <div class="pvx-header" ng-if="config.ShowLabel && (pvx.title || pvx.subtitle)">
            <div class="pvx-title pvx-truncate" title="{{pvx.title}}">{{pvx.title}}</div>
            <div class="pvx-subtitle pvx-truncate" ng-if="pvx.subtitle">{{pvx.subtitle}}</div>
        </div>

        <div class="pvx-body">
            <!-- Everything below is drawn as SVG by symbol.js; keep this div empty. -->
            <div class="pvx-heat-body"></div>
        </div>

        <div class="pvx-footer" ng-if="pvx.note || pvx.range">
            <span class="pvx-heat-note pvx-truncate" ng-if="pvx.note" title="{{pvx.note}}">{{pvx.note}}</span>
            <span class="pvx-heat-range pvx-num pvx-truncate" ng-if="pvx.range">{{pvx.range}}</span>
        </div>

    </div>

    <div class="pvx-error-badge" ng-if="pvx.error" title="{{pvx.error}}"></div>
</div>
