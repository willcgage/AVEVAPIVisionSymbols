<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" fill="none">
    <!-- pvxDeviation — a tolerance band around the target, with one excursion above it -->
    <rect x="40" y="176" width="432" height="160" fill="#2f9e5f" opacity="0.18"/>
    <line x1="40" y1="176" x2="472" y2="176" stroke="#2f9e5f" stroke-width="7" stroke-dasharray="20 15" opacity="0.9"/>
    <line x1="40" y1="336" x2="472" y2="336" stroke="#2f9e5f" stroke-width="7" stroke-dasharray="20 15" opacity="0.9"/>

    <!-- The target itself: the anchor of the whole picture, drawn heaviest -->
    <line x1="40" y1="256" x2="472" y2="256" stroke="#6f7378" stroke-width="14" stroke-linecap="round"/>

    <!-- Process value inside tolerance -->
    <path d="M48 300 L96 236 L144 306 L192 258 L240 214 L253 176"
          stroke="#3b82c4" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- ...breaking above the band once -->
    <path d="M253 176 L280 96 L320 80 L345 176"
          stroke="#c8452f" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M345 176 L356 220 L400 320 L440 272 L464 308"
          stroke="#3b82c4" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
