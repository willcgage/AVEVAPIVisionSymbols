        <path d="M84 68 L84 428" />
        <path d="M84 428 L444 428" />
    </g>

    <!-- least-squares line through the cloud -->
    <path d="M118 384 L414 136" stroke="#c8452f" stroke-width="18" stroke-linecap="round" />

