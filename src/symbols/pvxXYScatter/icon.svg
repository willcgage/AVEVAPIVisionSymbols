<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" fill="none">
    <!-- pvxXYScatter — scattered dots trending up-right with a best-fit line -->

    <!-- axes: faint, so the data reads first at small sizes -->
