    <g fill="#3b82c4">
        <circle cx="132" cy="388" r="19" />
        <circle cx="170" cy="344" r="19" />
        <circle cx="160" cy="392" r="19" />
        <circle cx="214" cy="330" r="19" />
        <circle cx="206" cy="376" r="19" />
