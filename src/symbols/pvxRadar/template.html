<div class="pvx pvx-radar"
     ng-style="{'background': pvx.background,
                'border-radius': (config.CornerRadius || 0) + 'px'}">
    <div class="pvx-surface pvx-radar-surface">

        <!-- pvx.showHeader / pvx.showFooter are size decisions made in
             symbol.js: on a tile too small for the web, the shape is the only
             thing worth the pixels. -->
        <div class="pvx-header" ng-if="pvx.showHeader && (pvx.title || pvx.subtitle)">
            <div class="pvx-title pvx-truncate" title="{{pvx.title}}">{{pvx.title}}</div>
            <div class="pvx-subtitle pvx-truncate" ng-if="pvx.subtitle">{{pvx.subtitle}}</div>
        </div>

        <div class="pvx-body">
            <!-- The web, the polygons, the axis labels and the legend are all
                 drawn as SVG by symbol.js; keep this div empty. -->
            <div class="pvx-radar-body"></div>
        </div>

        <div class="pvx-footer" ng-if="pvx.showFooter && (pvx.note || pvx.count)">
            <span class="pvx-radar-note pvx-truncate" ng-if="pvx.note" title="{{pvx.note}}">{{pvx.note}}</span>
            <span class="pvx-radar-count pvx-num pvx-truncate" ng-if="pvx.count">{{pvx.count}}</span>
        </div>

    </div>

    <div class="pvx-error-badge" ng-if="pvx.error" title="{{pvx.error}}"></div>
</div>
