<div class="pvx pvx-sp"
     ng-style="{'background': pvx.background,
                'border-radius': (config.CornerRadius || 0) + 'px'}">
    <div class="pvx-surface pvx-sp-surface">

        <div class="pvx-header" ng-if="pvx.showHeader && (pvx.title || pvx.subtitle)">
            <div class="pvx-title pvx-truncate" title="{{pvx.title}}">{{pvx.title}}</div>
            <div class="pvx-subtitle pvx-truncate" ng-if="pvx.subtitle">{{pvx.subtitle}}</div>
        </div>

        <div class="pvx-body">
            <!-- Background image, placeholder grid, markers, labels and legend
                 are all one SVG drawn by symbol.js so the hotspots share a
                 single coordinate system with the image. Keep this div empty. -->
            <div class="pvx-sp-body"></div>
        </div>

        <div class="pvx-footer" ng-if="pvx.showFooter">
            <span class="pvx-sp-note pvx-truncate" ng-if="pvx.note" title="{{pvx.note}}">{{pvx.note}}</span>
            <span class="pvx-sp-count pvx-num pvx-truncate" ng-if="pvx.count">{{pvx.count}}</span>
        </div>

    </div>

    <div class="pvx-error-badge" ng-if="pvx.error" title="{{pvx.error}}"></div>
</div>
