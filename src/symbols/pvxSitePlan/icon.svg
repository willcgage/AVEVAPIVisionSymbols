<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512"
     role="img" aria-label="Site plan">
    <title>PVX Site Plan</title>
    <!-- Flat, transparent, no strokes on the plan itself: PI Vision draws symbol
         icons small, so the three status markers have to carry the meaning while
         the grey blocks only have to read as "a plant layout". -->
    <g fill="#d6dbe1">
        <rect x="44"  y="96"  width="150" height="118" rx="10"/>
        <rect x="234" y="72"  width="106" height="76"  rx="10"/>
        <rect x="380" y="150" width="88"  height="180" rx="10"/>
        <rect x="60"  y="286" width="118" height="130" rx="10"/>
        <rect x="222" y="330" width="128" height="86"  rx="10"/>
    </g>

    <!-- Pipe run tying the blocks together. -->
    <g fill="none" stroke="#d6dbe1" stroke-width="14" stroke-linecap="round" stroke-linejoin="round">
        <path d="M119 214 L119 286"/>
        <path d="M287 148 L287 250 L424 250"/>
        <path d="M119 351 L222 373"/>
    </g>

    <g>
        <circle cx="119" cy="155" r="34" fill="#2f9e5f"/>
        <circle cx="287" cy="110" r="34" fill="#d99024"/>
        <circle cx="424" cy="240" r="34" fill="#c8452f"/>
    </g>
</svg>
