<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512"
     role="img" aria-label="Treemap">
    <title>PVX Treemap</title>
    <!-- Flat, transparent, no strokes. The gaps between the tiles are empty
         space rather than painted rules, so the icon reads correctly on the
         light and dark symbol pickers alike.

         The arrangement is a real squarified layout: one dominant tile, a
         second rank beside it, and the remainder packed into near-square
         rectangles instead of slivers — which is the whole point of the
         symbol. Colors are the shared PVX status palette so the icon says
         "sized by one number, colored by another" at a glance. -->
    <g>
        <rect x="24"  y="24"  width="264" height="264" fill="#3b82c4"/>
        <rect x="298" y="24"  width="190" height="180" fill="#c8452f"/>

        <rect x="298" y="214" width="90"  height="74"  fill="#d6dbe1"/>
        <rect x="398" y="214" width="90"  height="74"  fill="#d6dbe1"/>

        <rect x="24"  y="298" width="264" height="190" fill="#2f9e5f"/>
        <rect x="298" y="298" width="190" height="190" fill="#d99024"/>
    </g>
</svg>
