<!--
    pvxPeriodOverlay — deliberately thin.

    Everything inside .pvx-po-body is drawn imperatively as one SVG by
    symbol.js. Only the header title, the period caption, the footer note and
    the bad-quality badge are Angular bindings, because those are the four
    things a user may want to select, read with a screen reader, or see
    ellipsised by the browser.

    The caption is a binding rather than SVG text on purpose: it states HOW the
    window was folded ("1 day periods, clock aligned, 7"), and that sentence is
    the first thing anyone needs when the picture surprises them.

    Theme colors arrive as CSS custom properties written on the root by
    symbol.js, so the template needs no scope binding for light/dark. The root
    may safely paint its own surface: PVX.theme.isDark starts probing at the
    root's parent, so a symbol can never sample its own output.
-->
<div class="pvx pvx-po"
     ng-style="{'border-radius': (config.CornerRadius || 0) + 'px',
                'background': config.Transparent ? 'transparent' : 'var(--pvx-surface)'}">
    <div class="pvx-surface pvx-po-surface">

        <div class="pvx-header" ng-if="config.ShowLabel && pvx.title">
            <div class="pvx-title pvx-truncate" title="{{pvx.title}}">{{pvx.title}}</div>
            <div class="pvx-subtitle pvx-po-period pvx-num" ng-if="pvx.period" title="{{pvx.period}}">{{pvx.period}}</div>
        </div>

        <div class="pvx-body">
            <div class="pvx-po-body"></div>
        </div>

        <div class="pvx-footer" ng-if="pvx.note">
            <span class="pvx-truncate pvx-po-note" title="{{pvx.note}}">{{pvx.note}}</span>
        </div>

    </div>

    <div class="pvx-error-badge" ng-if="pvx.error" title="{{pvx.error}}"></div>
</div>
