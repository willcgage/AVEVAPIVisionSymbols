<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" fill="none">
    <!-- Connectors first: they run the full width of the two bars they join and
         are then covered by the bars, so only the gap segment shows. -->
    <g stroke="#d6dbe1" stroke-width="6" stroke-linecap="butt">
        <line x1="48" y1="300" x2="200" y2="300"/>
        <line x1="136" y1="230" x2="288" y2="230"/>
        <line x1="224" y1="170" x2="376" y2="170"/>
        <line x1="312" y1="250" x2="464" y2="250"/>
    </g>

    <!-- Start bar: grounded on the baseline. -->
    <rect x="48" y="300" width="64" height="172" rx="4" fill="#3b82c4"/>
    <!-- Two floating steps up. -->
    <rect x="136" y="230" width="64" height="70" rx="4" fill="#2f9e5f"/>
    <rect x="224" y="170" width="64" height="60" rx="4" fill="#2f9e5f"/>
    <!-- One floating step down. -->
    <rect x="312" y="170" width="64" height="80" rx="4" fill="#c8452f"/>
    <!-- Total bar: grounded again. -->
    <rect x="400" y="250" width="64" height="222" rx="4" fill="#3b82c4"/>
</svg>
