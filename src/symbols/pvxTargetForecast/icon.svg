<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="PVX Target &amp; Forecast">
    <title>PVX Target &amp; Forecast</title>

    <!-- A solid actual climbing toward a stepped target, then a dashed
         forecast carrying on past a "now" line into a shaded future, with
         its range as a band. Background is transparent by design. -->
    <rect x="296" y="48" width="176" height="416" fill="#5c6570" fill-opacity="0.12"/>
    <line x1="296" y1="48" x2="296" y2="464" stroke="#5c6570" stroke-width="8" stroke-dasharray="14 12"/>
    <path d="M296,236 L472,150 L472,250 L296,268 Z" fill="#e2803c" fill-opacity="0.25"/>
    <polyline points="40,232 168,232 168,176 472,176" fill="none" stroke="#1d2126" stroke-width="14" stroke-linejoin="miter"/>
    <polyline points="40,400 104,356 168,372 232,300 296,252" fill="none" stroke="#3b82c4" stroke-width="18"
              stroke-linejoin="round" stroke-linecap="round"/>
    <polyline points="296,252 384,214 472,200" fill="none" stroke="#e2803c" stroke-width="18"
              stroke-dasharray="34 18" stroke-linecap="round"/>
    <circle cx="296" cy="252" r="24" fill="#3b82c4"/>
</svg>
