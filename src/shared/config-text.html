    <!-- Injected by tools/build.js after the Data sources list in every PVX
         format pane. PVX.bootstrap applies config.TextScale to the symbol. -->
    <div class="pvx-cfg-group pvx-cfg-text">
        <div class="pvx-cfg-legend">Text size</div>
        <div class="pvx-cfg-row">
            <label for="pvx-cfg-textscale">Text size</label>
            <select id="pvx-cfg-textscale" ng-model="config.TextScale">
                <option value="70">70%</option>
                <option value="80">80%</option>
                <option value="90">90%</option>
                <option value="100">100% (standard)</option>
                <option value="110">110%</option>
                <option value="125">125%</option>
                <option value="150">150%</option>
                <option value="175">175%</option>
                <option value="200">200%</option>
            </select>
        </div>
        <div class="pvx-cfg-hint">
            Scales everything drawn inside the symbol, text included, and keeps it inside
            the symbol's box. Larger text leaves room for fewer rows, ticks and characters,
            so names truncate sooner; enlarge the symbol to give that room back.
        </div>
    </div>
